<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post - Blog Admin - Tytyber club place</title>
    <link rel="stylesheet" href="/assets/styles/index.css">
</head>
<body>
<!-- Header -->
<header class="header">
    <nav class="nav">
        <div class="logo">Tytyber</div>
        <ul class="nav-links">
            <li><a href="/blog">BLOG</a></li>
            <li><a href="/admin">dashboard</a></li>
            <li><a href="/admin/users">users</a></li>
            <li><a href="/admin/chat">admin chat</a></li>
        </ul>
    </nav>
</header>

<!-- Blog Admin Form -->
<section class="blog-admin">
    <h1>/08 CREATE NEW BLOG POST</h1>
    
    <form class="blog-admin-form" method="POST" action="/admin/blog/create" enctype="multipart/form-data">
        <div class="form-group">
            <label>TITLE</label>
            <input type="text" name="title" required placeholder="Enter post title...">
        </div>
        
        <div class="form-group">
            <label>CONTENT</label>
            <textarea name="content" required placeholder="Enter post content (HTML supported)..."></textarea>
        </div>
        
        <div class="form-group">
            <label>IMAGE URL (optional)</label>
            <input type="text" name="image_url" placeholder="Enter image URL (https://example.com/image.jpg)...">
        </div>
        
        <div class="form-group">
            <label>UPLOAD IMAGE FILE (optional)</label>
            <div class="file-upload" ondragover="handleDragOver(event)" ondrop="handleDrop(event)">
                <input type="file" name="image_file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
                <label for="fileInput" class="file-upload-label">
                    <span class="file-upload-icon"></span>
                    <span class="file-upload-text">Drag & drop image here or click to select</span>
                </label>
                <small style="color: var(--text-gray); font-size: 0.8rem;">JPG, PNG, GIF, WEBP supported (max 32MB)</small>
            </div>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn-primary">CREATE POST</button>
            <a href="/admin/blog" class="btn-secondary">CANCEL</a>
        </div>
    </form>
</section>

<!-- Admin Panel Footer -->
<footer class="footer">
    <div class="footer-bottom" style="text-align: center; margin-top: 3rem; padding-top: 2rem;">
        <span>> ACCESS GRANTED_</span>
    </div>
</footer>

<script src="/assets/js/index.js"></script>
</body>
</html>
